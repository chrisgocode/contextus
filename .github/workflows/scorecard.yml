name: Scorecard

# OpenSSF Scorecard. Publishes results for the README badge and uploads
# findings to the Security tab. The action only accepts runs on the default
# branch, so there is no pull_request trigger.
on:
  branch_protection_rule:
  schedule:
    - cron: "24 7 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Upload results to code scanning.
      security-events: write
      # Publish results to the public Scorecard API for the badge.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif

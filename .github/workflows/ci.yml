name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck

      # Holds Vitest's UI dep pre-bundle and its results cache (past durations,
      # which order slow files first). A stale bundle is rebuilt, not used.
      - name: Cache Vitest dependency pre-bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('bun.lock', 'vitest.config.ts') }}
      - run: bun run test

  # Playwright against a throwaway anonymous local Convex backend, so every run
  # gets a fresh database and needs no secrets.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      CONVEX_AGENT_MODE: anonymous
      E2E_ACCOUNT_NAMESPACE: ci
      E2E_PASSWORD: ci-e2e-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile

      # Backgrounded so Convex boots while the app builds. The build only needs
      # the backend's URL, which is fixed for a fresh anonymous deployment.
      # The `check` job already typechecks convex/.
      - name: Start local Convex backend
        run: |
          nohup bash -c '
            # Renamed into place so the wait step never reads a half-written file.
            finish() {
              echo "$1" > "$RUNNER_TEMP/convex.done.tmp"
              mv "$RUNNER_TEMP/convex.done.tmp" "$RUNNER_TEMP/convex.done"
              exit 0
            }
            bunx convex dev --typecheck disable --tail-logs disable > "$RUNNER_TEMP/convex.log" 2>&1 &
            configured=0
            for _ in $(seq 1 180); do
              if [ "$configured" -eq 0 ] && [ -f .env.local ] && grep -q "^CONVEX_DEPLOYMENT=" .env.local; then
                node scripts/setup-e2e-convex-env.mjs > "$RUNNER_TEMP/convex-env.log" 2>&1 || finish 1
                configured=1
              fi
              if [ "$configured" -eq 1 ] && grep -q "Convex functions ready" "$RUNNER_TEMP/convex.log"; then
                finish 0
              fi
              sleep 0.5
            done
            finish 1
          ' > /dev/null 2>&1 &

      # Only the headless shell: Playwright's default for headless Chromium.
      # The runner image already ships its system libraries, so no apt step.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --only-shell chromium

      # Turbopack's persistent build cache. After a source change the closest
      # previous cache is restored and only affected modules rebuild.
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'convex/**', '*.ts', '*.mjs', '*.css') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - run: bun run build
        env:
          SKIP_BUILD_TYPECHECK: "1"
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
          NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211

      - name: Wait for local Convex backend
        run: |
          for _ in $(seq 1 180); do
            [ -f "$RUNNER_TEMP/convex.done" ] && break
            sleep 0.5
          done
          if [ "$(cat "$RUNNER_TEMP/convex.done" 2>/dev/null)" != 0 ]; then
            cat "$RUNNER_TEMP/convex.log" "$RUNNER_TEMP/convex-env.log" 2>/dev/null
            exit 1
          fi
          # The build inlined this URL; fail if Convex came up elsewhere.
          grep -qx "NEXT_PUBLIC_CONVEX_URL=http://127.0.0.1:3210" .env.local || {
            cat .env.local
            exit 1
          }
      - run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/convex.log
            ${{ runner.temp }}/convex-env.log
          retention-days: 14

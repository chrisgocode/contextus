name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck

      # Holds Vitest's UI dep pre-bundle and its results cache (past durations,
      # which order slow files first). A stale bundle is rebuilt, not used.
      - name: Cache Vitest dependency pre-bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('bun.lock', 'vitest.config.ts') }}
      - run: bun run test

  # Playwright against a throwaway anonymous local Convex backend, so every run
  # gets a fresh database and needs no secrets.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      CONVEX_AGENT_MODE: anonymous
      E2E_ACCOUNT_NAMESPACE: ci
      E2E_PASSWORD: ci-e2e-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # Writes NEXT_PUBLIC_CONVEX_URL to .env.local, which the build inlines.
      # The `check` job already typechecks convex/.
      - name: Start local Convex backend
        run: |
          bunx convex dev --typecheck disable --tail-logs disable > "$RUNNER_TEMP/convex.log" 2>&1 &
          for _ in $(seq 1 90); do
            if grep -q "Convex functions ready" "$RUNNER_TEMP/convex.log"; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/convex.log"
          exit 1
      - run: node scripts/setup-e2e-convex-env.mjs
      - run: bun run build
      - run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/convex.log
          retention-days: 14

name: zizmor

# Audits workflows for template injection, excessive permissions, credential
# persistence, and unpinned actions. Findings land in the Security tab and
# block merges through the code scanning ruleset, not through job failure.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1

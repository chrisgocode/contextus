name: Deploy

# Deploys a release tag to production: Convex first, so the new frontend never
# goes live against old functions, then Vercel. Called by release-please.yml
# when a release is cut; run it by hand to redeploy or roll back to an earlier
# tag.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      CONVEX_DEPLOY_KEY:
        required: true
      VERCEL_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (e.g. v0.2.0)
        type: string
        required: true

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Waits for a required reviewer's approval, and only runs from main.
    environment: Production
    permissions:
      contents: read
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      # Only release tags on main, so a manual run can't ship a branch or
      # commit that skipped the PR checks.
      - name: Check tag is a release on main
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi
        env:
          TAG: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx convex deploy --typecheck enable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      # Builds on Vercel, not the runner, so VERCEL_DEPLOYMENT_ID (the app
      # version in next.config.ts) and the Vercel env vars are set.
      - run: bunx vercel@60.1.3 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

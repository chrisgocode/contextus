version: 2
updates:
  # Use the bun ecosystem so Dependabot updates bun.lock alongside
  # package.json. Without this, security PRs fall back to npm and leave the
  # lockfile stale, which breaks `bun install --frozen-lockfile`.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Cooldown only delays version updates; security updates open immediately.
    cooldown:
      default-days: 7
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      next:
        applies-to: version-updates
        patterns: ["next", "eslint-config-next", "@next/*"]
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
